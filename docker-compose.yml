# Local development stack.
#
# Replit runs this repo its own way; this file exists so the whole thing can
# be brought up on a laptop with one command and no local Node, pnpm or
# Postgres install. It does not replace the Replit config and nothing here is
# referenced by it.
#
#   docker compose up
#   → web  http://localhost:5173
#   → api  http://localhost:5000
#
# Secrets come from .env (gitignored). Copy .env.example and fill it in.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: smoothieking
    ports:
      # 55432 on the host so this cannot collide with a Postgres someone
      # already runs locally.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smoothieking"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot. Both app services mount the same tree, so letting them install
  # concurrently would have two pnpm processes writing the same node_modules.
  #
  # pnpm is pinned to 9 because pnpm-lock.yaml is lockfileVersion 9.0 and the
  # repo has no packageManager field, so corepack would otherwise pull the
  # latest. On 11 the install fails outright: pnpm-workspace.yaml carries an
  # unfilled placeholder — `allowBuilds: esbuild: set this to true or false` —
  # which newer pnpm reads in preference to onlyBuiltDependencies and, not
  # being a boolean, denies the build. Left alone rather than edited; that
  # block has a security warning on it and is the repo's call, not this
  # file's.
  install:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # Non-interactive: pnpm otherwise prompts before reinstalling modules
      # and a compose run has no TTY to answer with.
      CI: "true"
    # --no-frozen-lockfile because CI=true implies frozen, and the committed
    # lockfile's recorded `overrides` do not match pnpm-workspace.yaml. That
    # mismatch predates this file; unfreezing is the local-dev workaround, not
    # a fix. If pnpm-lock.yaml changes as a result, that is a signal the repo
    # needs a lockfile refresh rather than something to commit from here.
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.9 --activate &&
             pnpm install --no-frozen-lockfile"

  api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://postgres:dev@db:5432/smoothieking
      # Read from the host environment or .env — never written into an image
      # or committed. Same handling the elicitation POC used.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    ports:
      # 5001 on the host: macOS binds 5000 for AirPlay Receiver by default, so
      # the container port stays 5000 and only the outside mapping moves.
      # Service-to-service traffic uses api:5000 and is unaffected.
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9.15.9 --activate &&
             pnpm --filter @workspace/db run push &&
             pnpm --filter @workspace/api-server run dev"

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PORT: "5173"
      BASE_PATH: /
      # The vite config proxies /api here. Defaults to localhost:5000 so the
      # Replit setup is unaffected; inside compose the api is a service name.
      API_PROXY_TARGET: http://api:5000
    ports:
      - "5173:5173"
    depends_on:
      install:
        condition: service_completed_successfully
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm --filter @workspace/smoothy-king run dev"

volumes:
  db-data:
